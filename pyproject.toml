[project]
name = "tts-studio"
version = "0.7.0"
description = "Local Chinese voice-cloning TTS service with WebUI and HTTP API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.2",
  "python-multipart",
  "soundfile==0.12.1",
  "numpy",
  "requests>=2.31",
  "psutil",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
